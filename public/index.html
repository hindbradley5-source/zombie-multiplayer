<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            background-color: #1b1b1b;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #ff4444;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        #game-over h1 {
            color: #ff4444;
            font-size: 36px;
            margin-bottom: 10px;
        }
        #game-over p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        #retryBtn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff4444;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #retryBtn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <!-- HUD Overlay -->
    <div id="ui">
        <div id="healthDisplay">Health: 100</div>
        <div id="waveDisplay">Wave: 1</div>
        <div id="weaponDisplay">Weapon: Pistol (Rate: 400ms)</div>
        <div id="upgradeDisplay">Upgrades: None</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over">
        <h1>YOU DIED</h1>
        <p id="finalWave">You made it to Wave 1</p>
        <button id="retryBtn" onclick="restartGame()">Retry</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Fit canvas to window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Base Configuration Defaults
        const BASE_PISTOL_FIRERATE = 400; // ms between shots
        const MINIGUN_FIRERATE = 80;

        // Game State Variables
        let isGameOver = false;
        let currentWave = 1;
        let score = 0;
        let lastShotTime = 0;

        // Dynamic Entity Containers
        let zombies = [];
        let drops = [];
        let barrels = [];
        let projectiles = [];

        // Input Tracking
        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, isDown: false };

        // Player Object Setup
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 18,
            speed: 4,
            health: 100,
            maxHealth: 100,
            // Weapon & Upgrade State
            currentWeapon: 'pistol',
            fireRate: BASE_PISTOL_FIRERATE,
            speedMultiplier: 1,
            damageMultiplier: 1,
            upgrades: []
        };

        // --- GAME START & RESET LOGIC ---

        function restartGame() {
            // 1. Hide Game Over Screen
            document.getElementById('game-over').style.display = 'none';
            isGameOver = false;

            // 2. Explicitly Reset Wave & Score
            currentWave = 1;
            score = 0;

            // 3. Completely Reset Player Stats & Upgrades
            player.health = player.maxHealth;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            
            // Revert Weapon to Pistol State
            player.currentWeapon = 'pistol';
            player.fireRate = BASE_PISTOL_FIRERATE;
            
            // Revert Multipliers & Upgrades
            player.speedMultiplier = 1;
            player.damageMultiplier = 1;
            player.upgrades = [];

            // 4. Wipe All World Entities
            zombies = [];
            drops = [];
            barrels = [];
            projectiles = [];

            // 5. Initialize Wave 1
            startWave(currentWave);
            updateUI();
        }

        // --- WAVE TRANSITION LOGIC ---

        function startWave(waveNumber) {
            // CLEAR GROUND: Remove remaining drops and barrels when starting a wave
            drops = [];
            barrels = [];
            projectiles = [];

            // Spawn Barrels for the wave
            spawnBarrels(3);

            // Spawn Zombies based on wave number
            const zombieCount = waveNumber * 5;
            for (let i = 0; i < zombieCount; i++) {
                spawnZombie();
            }

            updateUI();
        }

        function checkWaveProgress() {
            // Trigger next wave only when all zombies are eliminated
            if (zombies.length === 0 && !isGameOver) {
                currentWave++;
                startWave(currentWave);
            }
        }

        // --- SPAWN HELPERS ---

        function spawnZombie() {
            // Spawn around canvas borders
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }

            zombies.push({
                x: x,
                y: y,
                radius: 16,
                speed: 1.5 + (currentWave * 0.1),
                health: 30 + (currentWave * 5)
            });
        }

        function spawnBarrels(count) {
            for (let i = 0; i < count; i++) {
                barrels.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 100 + Math.random() * (canvas.height - 200),
                    radius: 20,
                    health: 50
                });
            }
        }

        function createDrop(x, y) {
            // Spawn a minigun pickup drop
            drops.push({
                x: x,
                y: y,
                type: 'minigun',
                radius: 12
            });
        }

        // --- INPUT ENGINE ---

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.isDown = true);
        window.addEventListener('mouseup', () => mouse.isDown = false);

        // --- SHOOTING & WEAPONS ---

        function shoot() {
            const now = Date.now();
            if (now - lastShotTime < player.fireRate) return;
            lastShotTime = now;

            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            projectiles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                damage: 25 * player.damageMultiplier,
                radius: 4
            });
        }

        // --- GAME OVER ---

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('finalWave').innerText = `You made it to Wave ${currentWave}`;
            document.getElementById('game-over').style.display = 'block';
        }

        // --- UI SYNC ---

        function updateUI() {
            document.getElementById('healthDisplay').innerText = `Health: ${Math.max(0, Math.round(player.health))}`;
            document.getElementById('waveDisplay').innerText = `Wave: ${currentWave}`;
            document.getElementById('weaponDisplay').innerText = `Weapon: ${player.currentWeapon.toUpperCase()} (Rate: ${player.fireRate}ms)`;
            document.getElementById('upgradeDisplay').innerText = `Upgrades: ${player.upgrades.length > 0 ? player.upgrades.join(', ') : 'None'}`;
        }

        // --- MAIN UPDATE LOOP ---

        function update() {
            if (isGameOver) return;

            // Player Movement
            let moveSpeed = player.speed * player.speedMultiplier;
            if (keys['w'] || keys['arrowup']) player.y -= moveSpeed;
            if (keys['s'] || keys['arrowdown']) player.y += moveSpeed;
            if (keys['a'] || keys['arrowleft']) player.x -= moveSpeed;
            if (keys['d'] || keys['arrowright']) player.x += moveSpeed;

            // Shooting
            if (mouse.isDown) {
                shoot();
            }

            // Update Bullets
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;

                // Remove offscreen projectiles
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                    continue;
                }

                // Bullet vs Zombie Collision
                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    let dist = Math.hypot(p.x - z.x, p.y - z.y);
                    if (dist < p.radius + z.radius) {
                        z.health -= p.damage;
                        projectiles.splice(i, 1);

                        if (z.health <= 0) {
                            // 20% chance to drop minigun item on death
                            if (Math.random() < 0.2) createDrop(z.x, z.y);
                            zombies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // Update Zombies
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                let angle = Math.atan2(player.y - z.y, player.x - z.x);
                z.x += Math.cos(angle) * z.speed;
                z.y += Math.sin(angle) * z.speed;

                // Zombie vs Player Collision
                let dist = Math.hypot(player.x - z.x, player.y - z.y);
                if (dist < player.radius + z.radius) {
                    player.health -= 0.5;
                    updateUI();
                    if (player.health <= 0) {
                        triggerGameOver();
                    }
                }
            }

            // Update Ground Drops (Pickups)
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                let dist = Math.hypot(player.x - d.x, player.y - d.y);
                if (dist < player.radius + d.radius) {
                    if (d.type === 'minigun') {
                        player.currentWeapon = 'minigun';
                        player.fireRate = MINIGUN_FIRERATE; // Instant fire rate boost
                        if (!player.upgrades.includes('Minigun')) {
                            player.upgrades.push('Minigun');
                        }
                    }
                    drops.splice(i, 1);
                    updateUI();
                }
            }

            checkWaveProgress();
        }

        // --- MAIN DRAW LOOP ---

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGameOver) return;

            // Draw Barrels
            ctx.fillStyle = '#795548';
            barrels.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Drops
            drops.forEach(d => {
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Bullets
            ctx.fillStyle = '#fff59d';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Zombies
            ctx.fillStyle = '#4caf50';
            zombies.forEach(z => {
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Player
            ctx.fillStyle = '#2196f3';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Player Gun Pointer
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(angle) * 28, player.y + Math.sin(angle) * 28);
            ctx.stroke();
        }

        // --- GAME LOOP ROUTINE ---

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start initial game instance
        restartGame();
        gameLoop();
    </script>
</body>
</html>
