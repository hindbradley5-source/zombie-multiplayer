<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zombie Multiplayer Survival</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #1a1a1a;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        input, button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        input {
            background: #fff;
            color: #000;
        }
        button {
            background: #27ae60;
            color: white;
            font-weight: bold;
        }
        button:hover {
            background: #2ecc71;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        #top-right-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 5;
            display: flex;
            gap: 10px;
        }
        #in-game-menu-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: #7f8c8d;
        }
        #in-game-menu-btn:hover {
            background: #95a5a6;
        }
        /* Full Screen Shop Overlay */
        #shop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 10, 0.92);
            z-index: 8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin-top: 20px;
        }
        .shop-grid button {
            padding: 15px;
            font-size: 14px;
            width: 260px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- HUD Top Left -->
        <div id="hud" class="hidden">
            Wave: <span id="wave-display">1</span> | 
            Money: $<span id="money-display">0</span> | 
            HP: <span id="hp-display">100</span> 
            <span id="extra-stat" style="color: #f1c40f; margin-left: 10px;"></span>
        </div>

        <!-- Top Right Controls -->
        <div id="top-right-controls">
            <button id="in-game-menu-btn" class="hidden" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <!-- Full-Screen Shop Overlay -->
        <div id="shop" class="hidden">
            <h2 style="color: #f1c40f; margin-bottom: 5px;">🛒 ARMORY & SHOP</h2>
            <p style="font-size: 18px; margin-bottom: 15px;">Next wave starts in: <span id="shop-timer" style="color: #e74c3c; font-weight: bold;">30</span>s</p>
            <div class="shop-grid">
                <button onclick="buyItem('health')">Heal Full ($50)</button>
                <button onclick="buyItem('maxHealth')">+10% Max HP ($120)</button>
                <button onclick="buyItem('damage')">+1% Damage ($100)</button>
                <button onclick="buyItem('speed')">+1% Speed ($75)</button>
                <button onclick="buyItem('shotgun')" style="background: #e67e22;">Shotgun (Marksman) ($150)</button>
                <button onclick="buyItem('minigun')" style="background: #c0392b;">Minigun (Marksman) ($250)</button>
                <button onclick="buyItem('fireStaff')" style="background: #8e44ad;">Fire Staff (Mage) ($160)</button>
                <button onclick="buyItem('lightning')" style="background: #2980b9;">Lightning (Mage) ($260)</button>
                <button onclick="buyItem('fireAx')" style="background: #d35400;">Fire Axe (Melee) ($130)</button>
                <button onclick="buyItem('katana')" style="background: #16a085;">Laser Katana (Melee) ($240)</button>
                <button onclick="buyItem('megaWeapon')" style="background: #e74c3c; font-weight: bold; grid-column: span 2;">⚡ Mega Weapon ($100,000)</button>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Main Menu Screen -->
        <div id="main-menu" class="screen">
            <h2>Zombie Multiplayer Survival</h2>
            <button onclick="createParty()">Create Party</button>
            <br>
            <input type="text" id="party-code-input" placeholder="Enter 4-Letter Code" maxlength="4">
            <br>
            <button onclick="joinParty()" style="background: #2980b9;">Join Party</button>
            <p id="error-msg" style="color: #e74c3c; margin-top: 10px;"></p>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen hidden">
            <h2 id="party-code-display">Party Code: </h2>
            <p>Give this code to your friend!</p>
            <div style="background: #222; padding: 20px; border-radius: 5px; width: 320px; margin-bottom: 20px;">
                <h4>Players in Party:</h4>
                <ul id="player-list" style="list-style: none; padding: 0;"></ul>
            </div>
            <h3>Choose Your Class:</h3>
            <div>
                <button onclick="selectClass('mage')" style="background: #9b59b6;">Mage</button>
                <button onclick="selectClass('melee')" style="background: #95a5a6;">Melee</button>
                <button onclick="selectClass('marksman')" style="background: #f1c40f; color: #000;">Marksman</button>
            </div>
            <br>
            <button id="start-game-btn" onclick="startGame()" class="hidden" style="background: #e67e22;">Start Game</button>
            <br>
            <button onclick="goToMainMenu()" style="background: #7f8c8d; font-size: 14px;">Main Menu</button>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" class="screen hidden">
            <h2 style="color: #e74c3c; font-size: 48px; margin-bottom: 5px;">YOU DIED</h2>
            <p style="color: #bbb; font-size: 20px; margin-bottom: 20px;">The zombies overwhelmed you.</p>
            <button onclick="respawnPlayer()" style="background: #e67e22; font-size: 20px;">Respawn</button>
            <button onclick="goToMainMenu()" style="background: #7f8c8d; font-size: 16px; margin-top: 15px;">Main Menu</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const mainMenu = document.getElementById('main-menu');
        const lobbyScreen = document.getElementById('lobby-screen');
        const deathScreen = document.getElementById('death-screen');
        const hud = document.getElementById('hud');
        const shop = document.getElementById('shop');
        const inGameMenuBtn = document.getElementById('in-game-menu-btn');
        const partyCodeDisplay = document.getElementById('party-code-display');
        const playerList = document.getElementById('player-list');
        const errorMsg = document.getElementById('error-msg');
        const startGameBtn = document.getElementById('start-game-btn');
        const extraStat = document.getElementById('extra-stat');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = { players: {}, bullets: [], zombies: [], pickups: [], barrels: [], wave: 1, waveActive: false, shopTimer: 30 };

        function createParty() { socket.emit('createParty'); }
        function joinParty() { socket.emit('joinParty', document.getElementById('party-code-input').value); }
        function selectClass(cls) { socket.emit('selectClass', cls); }
        function startGame() { socket.emit('startGame'); }
        function respawnPlayer() { socket.emit('respawn'); }
        function buyItem(item) { socket.emit('buy', item); }
        function goToMainMenu() { location.reload(); }

        socket.on('partyCreated', (code) => {
            mainMenu.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            partyCodeDisplay.innerText = `Party Code: ${code}`;
            startGameBtn.classList.remove('hidden');
        });

        socket.on('partyJoined', (code) => {
            mainMenu.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            partyCodeDisplay.innerText = `Party Code: ${code}`;
        });

        socket.on('partyError', (msg) => { errorMsg.innerText = msg; });

        socket.on('lobbyUpdate', (players) => {
            playerList.innerHTML = '';
            for (let id in players) {
                let p = players[id];
                let li = document.createElement('li');
                li.innerText = `Player (${id === socket.id ? 'You' : 'Friend'}) - Class: ${p.class.toUpperCase()}`;
                playerList.appendChild(li);
            }
        });

        socket.on('gameStarted', () => {
            lobbyScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            inGameMenuBtn.classList.remove('hidden');
        });

        socket.on('stateUpdate', (state) => {
            gameState = state;

            document.getElementById('wave-display').innerText = gameState.wave;
            document.getElementById('shop-timer').innerText = gameState.shopTimer;
            let me = gameState.players[socket.id];
            if (me) {
                document.getElementById('money-display').innerText = me.money;
                document.getElementById('hp-display').innerText = `${Math.max(0, me.hp)}/${me.maxHp}`;

                if (me.hp <= 0) {
                    deathScreen.classList.remove('hidden');
                    inGameMenuBtn.classList.add('hidden');
                } else {
                    deathScreen.classList.add('hidden');
                    inGameMenuBtn.classList.remove('hidden');
                }

                let weaponName = me.weaponType ? me.weaponType.toUpperCase() : '';
                let statusText = ``;
                if (me.dashCooldown > 0) statusText += ` | Dash CD: ${me.dashCooldown}`;
                if (me.powerUpType) statusText += ` | [⚡ ${me.powerUpType.toUpperCase()}]`;

                if (me.class === 'marksman' && me.weaponType !== 'megaWeapon') {
                    extraStat.innerText = me.reloading ? `| [${weaponName}] Auto-Reloading...` : `| [${weaponName}] Ammo: ${me.ammo}/${me.maxAmmo} ${statusText}`;
                } else if (me.class === 'mage' && me.weaponType !== 'megaWeapon') {
                    extraStat.innerText = `| [${weaponName}] Mana: ${Math.floor(me.mana)}/${me.maxMana} ${statusText}`;
                } else {
                    extraStat.innerText = `| [${weaponName}] ${statusText}`;
                }
            }

            if (!gameState.waveActive) {
                shop.classList.remove('hidden');
            } else {
                shop.classList.add('hidden');
            }
        });

        const keys = {};
        window.addEventListener('keydown', (e) => { 
            keys[e.key.toLowerCase()] = true; 
            if (e.code === 'Space') {
                e.preventDefault();
                if (lobbyScreen.classList.contains('hidden')) {
                    socket.emit('move', {
                        up: keys['w'] || keys['arrowup'],
                        down: keys['s'] || keys['arrowdown'],
                        left: keys['a'] || keys['arrowleft'],
                        right: keys['d'] || keys['arrowright'],
                        dash: true
                    });
                }
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        setInterval(() => {
            if (!lobbyScreen.classList.contains('hidden')) return;
            socket.emit('move', {
                up: keys['w'] || keys['arrowup'],
                down: keys['s'] || keys['arrowdown'],
                left: keys['a'] || keys['arrowleft'],
                right: keys['d'] || keys['arrowright'],
                dash: false
            });
        }, 1000 / 30);

        canvas.addEventListener('click', (e) => {
            if (!lobbyScreen.classList.contains('hidden')) return;
            const me = gameState.players[socket.id];
            if (!me) return;

            const camX = me.x - canvas.width / 2;
            const camY = me.y - canvas.height / 2;

            socket.emit('shoot', { 
                x: e.clientX + camX, 
                y: e.clientY + camY 
            });
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (lobbyScreen.classList.contains('hidden')) {
                const me = gameState.players[socket.id];
                const camX = me ? me.x - canvas.width / 2 : 0;
                const camY = me ? me.y - canvas.height / 2 : 0;

                ctx.save();
                ctx.translate(-camX, -camY);

                let tintAlpha = Math.min(0.4, (gameState.wave % 5) * 0.08);
                ctx.fillStyle = `rgba(10, 0, 20, ${tintAlpha})`;
                ctx.fillRect(0, 0, 2000, 2000);

                ctx.strokeStyle = '#252525';
                ctx.lineWidth = 2;
                for (let i = 0; i <= 2000; i += 100) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0); ctx.lineTo(i, 2000);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i); ctx.lineTo(2000, i);
                    ctx.stroke();
                }

                // Arena Boundary Circle
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(1000, 1000, 950, 0, Math.PI * 2);
                ctx.stroke();

                if (gameState.barrels) {
                    gameState.barrels.forEach(barrel => {
                        ctx.font = '32px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🛢️', barrel.x + barrel.size/2, barrel.y + barrel.size/2);
                    });
                }

                gameState.pickups.forEach(p => {
                    ctx.font = '32px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let icon = '❤️';
                    if (p.type === 'speed') icon = '⚡';
                    if (p.type === 'doubleDamage') icon = '⭐';
                    ctx.fillText(icon, p.x, p.y);
                });

                ctx.fillStyle = '#f39c12';
                gameState.bullets.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                gameState.zombies.forEach(z => {
                    ctx.font = `${z.size * 1.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let emoji = '🧟';
                    if (z.type === 'boss') emoji = '👹';
                    ctx.fillText(emoji, z.x + z.size / 2, z.y + z.size / 2);

                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(z.x, z.y - 12, z.size, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(z.x, z.y - 12, z.size * Math.max(0, (z.hp / z.maxHp)), 5);
                });

                for (let id in gameState.players) {
                    let p = gameState.players[id];
                    if (p.hp > 0) {
                        if (p.hasForceField) {
                            ctx.strokeStyle = '#3498db';
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.arc(p.x + p.size/2, p.y + p.size/2, p.size * 1.5, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.font = `${p.size * 1.2}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🤠', p.x + p.size / 2, p.y + p.size / 2);

                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(p.x, p.y - 15, p.size, 5);
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(p.x, p.y - 15, p.size * Math.max(0, (p.hp / p.maxHp)), 5);
                    }
                }

                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
