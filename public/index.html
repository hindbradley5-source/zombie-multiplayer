<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zombie Multiplayer Game</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        input, button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        input {
            background: #fff;
            color: #000;
        }
        button {
            background: #27ae60;
            color: white;
            font-weight: bold;
        }
        button:hover {
            background: #2ecc71;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #in-game-menu-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            padding: 5px 12px;
            font-size: 12px;
            background: #7f8c8d;
            pointer-events: auto;
        }
        #in-game-menu-btn:hover {
            background: #95a5a6;
        }
        #shop {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            z-index: 5;
        }
        #shop button {
            padding: 5px 10px;
            font-size: 11px;
            margin: 2px;
            display: block;
            width: 180px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- HUD -->
        <div id="hud" class="hidden">
            Wave: <span id="wave-display">1</span> | 
            Money: $<span id="money-display">0</span> | 
            HP: <span id="hp-display">100</span> 
            <span id="extra-stat" style="color: #f1c40f; margin-left: 10px;"></span>
        </div>

        <!-- In-game Main Menu Button (Always available during gameplay) -->
        <button id="in-game-menu-btn" class="hidden" onclick="goToMainMenu()">Main Menu</button>

        <!-- Shop -->
        <div id="shop" class="hidden">
            <h4 style="margin: 0 0 5px 0; text-align: center;">Shop (Between Waves)</h4>
            <button onclick="buyItem('health')">Heal Full ($50)</button>
            <button onclick="buyItem('maxHealth')">+30 Max HP ($120)</button>
            <button onclick="buyItem('damage')">Buy Damage ($100)</button>
            <button onclick="buyItem('speed')">Buy Speed ($75)</button>
            <button onclick="buyItem('shotgun')" style="background: #e67e22;">Shotgun (Marksman) ($150)</button>
            <button onclick="buyItem('minigun')" style="background: #c0392b;">Minigun (Marksman) ($250)</button>
            <button onclick="buyItem('fireStaff')" style="background: #8e44ad;">Fire Staff (Mage) ($160)</button>
            <button onclick="buyItem('lightning')" style="background: #2980b9;">Lightning (Mage) ($260)</button>
            <button onclick="buyItem('fireAx')" style="background: #d35400;">Fire Axe (Melee) ($130)</button>
            <button onclick="buyItem('katana')" style="background: #16a085;">Laser Katana (Melee) ($240)</button>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Main Menu Screen -->
        <div id="main-menu" class="screen">
            <h2>Zombie Multiplayer Survival</h2>
            <button onclick="createParty()">Create Party</button>
            <br>
            <input type="text" id="party-code-input" placeholder="Enter 4-Letter Code" maxlength="4">
            <br>
            <button onclick="joinParty()" style="background: #2980b9;">Join Party</button>
            <p id="error-msg" style="color: #e74c3c; margin-top: 10px;"></p>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen hidden">
            <h2 id="party-code-display">Party Code: </h2>
            <p>Give this code to your friend!</p>
            <div style="background: #222; padding: 15px; border-radius: 5px; width: 300px; margin-bottom: 15px;">
                <h4>Players in Party:</h4>
                <ul id="player-list" style="list-style: none; padding: 0;"></ul>
            </div>
            <h3>Choose Your Class:</h3>
            <div>
                <button onclick="selectClass('mage')" style="background: #9b59b6;">Mage</button>
                <button onclick="selectClass('melee')" style="background: #95a5a6;">Melee</button>
                <button onclick="selectClass('marksman')" style="background: #f1c40f; color: #000;">Marksman</button>
            </div>
            <br>
            <button id="start-game-btn" onclick="startGame()" class="hidden" style="background: #e67e22;">Start Game</button>
            <br>
            <button onclick="goToMainMenu()" style="background: #7f8c8d; font-size: 14px;">Main Menu</button>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" class="screen hidden">
            <h2 style="color: #e74c3c; font-size: 36px; margin-bottom: 5px;">YOU DIED</h2>
            <p style="color: #bbb; margin-bottom: 20px;">The zombies overwhelmed you.</p>
            <button onclick="respawnPlayer()" style="background: #e67e22; font-size: 18px;">Respawn</button>
            <button onclick="goToMainMenu()" style="background: #7f8c8d; font-size: 16px; margin-top: 10px;">Main Menu</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const mainMenu = document.getElementById('main-menu');
        const lobbyScreen = document.getElementById('lobby-screen');
        const deathScreen = document.getElementById('death-screen');
        const hud = document.getElementById('hud');
        const shop = document.getElementById('shop');
        const inGameMenuBtn = document.getElementById('in-game-menu-btn');
        const partyCodeDisplay = document.getElementById('party-code-display');
        const playerList = document.getElementById('player-list');
        const errorMsg = document.getElementById('error-msg');
        const startGameBtn = document.getElementById('start-game-btn');
        const extraStat = document.getElementById('extra-stat');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = { players: {}, bullets: [], zombies: [], pickups: [], wave: 1, waveActive: false };

        function createParty() { socket.emit('createParty'); }
        function joinParty() { socket.emit('joinParty', document.getElementById('party-code-input').value); }
        function selectClass(cls) { socket.emit('selectClass', cls); }
        function startGame() { socket.emit('startGame'); }
        function respawnPlayer() { socket.emit('respawn'); }
        function buyItem(item) { socket.emit('buy', item); }
        function goToMainMenu() { location.reload(); }

        socket.on('partyCreated', (code) => {
            mainMenu.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            partyCodeDisplay.innerText = `Party Code: ${code}`;
            startGameBtn.classList.remove('hidden');
        });

        socket.on('partyJoined', (code) => {
            mainMenu.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            partyCodeDisplay.innerText = `Party Code: ${code}`;
        });

        socket.on('partyError', (msg) => { errorMsg.innerText = msg; });

        socket.on('lobbyUpdate', (players) => {
            playerList.innerHTML = '';
            for (let id in players) {
                let p = players[id];
                let li = document.createElement('li');
                li.innerText = `Player (${id === socket.id ? 'You' : 'Friend'}) - Class: ${p.class.toUpperCase()}`;
                playerList.appendChild(li);
            }
        });

        socket.on('gameStarted', () => {
            lobbyScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            inGameMenuBtn.classList.remove('hidden');
        });

        socket.on('stateUpdate', (state) => {
            gameState = state;

            document.getElementById('wave-display').innerText = gameState.wave;
            let me = gameState.players[socket.id];
            if (me) {
                document.getElementById('money-display').innerText = me.money;
                document.getElementById('hp-display').innerText = `${Math.max(0, me.hp)}/${me.maxHp}`;

                if (me.hp <= 0) {
                    deathScreen.classList.remove('hidden');
                    inGameMenuBtn.classList.add('hidden');
                } else {
                    deathScreen.classList.add('hidden');
                    inGameMenuBtn.classList.remove('hidden');
                }

                let weaponName = me.weaponType ? me.weaponType.toUpperCase() : '';
                if (me.class === 'marksman') {
                    extraStat.innerText = me.reloading ? `| [${weaponName}] Auto-Reloading...` : `| [${weaponName}] Ammo: ${me.ammo}/${me.maxAmmo}`;
                } else if (me.class === 'mage') {
                    extraStat.innerText = `| [${weaponName}] Mana: ${Math.floor(me.mana)}/${me.maxMana}`;
                } else {
                    extraStat.innerText = `| [${weaponName}] Melee`;
                }
            }

            if (!gameState.waveActive) {
                shop.classList.remove('hidden');
            } else {
                shop.classList.add('hidden');
            }
        });

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        setInterval(() => {
            if (!lobbyScreen.classList.contains('hidden')) return;
            socket.emit('move', {
                up: keys['w'] || keys['arrowup'],
                down: keys['s'] || keys['arrowdown'],
                left: keys['a'] || keys['arrowleft'],
                right: keys['d'] || keys['arrowright']
            });
        }, 1000 / 30);

        canvas.addEventListener('click', (e) => {
            if (!lobbyScreen.classList.contains('hidden')) return;
            const rect = canvas.getBoundingClientRect();
            socket.emit('shoot', { x: e.clientX - rect.left, y: e.clientY - rect.top });
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (lobbyScreen.classList.contains('hidden')) {
                gameState.pickups.forEach(p => {
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('❤️', p.x, p.y);
                });

                ctx.fillStyle = '#f39c12';
                gameState.bullets.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                gameState.zombies.forEach(z => {
                    ctx.font = `${z.size * 1.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let emoji = '🧟';
                    if (z.type === 'boss') emoji = '👹';
                    ctx.fillText(emoji, z.x + z.size / 2, z.y + z.size / 2);

                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(z.x, z.y - 8, z.size, 3);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(z.x, z.y - 8, z.size * Math.max(0, (z.hp / z.maxHp)), 3);
                });

                for (let id in gameState.players) {
                    let p = gameState.players[id];
                    if (p.hp > 0) {
                        ctx.font = `${p.size * 1.2}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🤠', p.x + p.size / 2, p.y + p.size / 2);

                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(p.x, p.y - 10, p.size, 4);
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(p.x, p.y - 10, p.size * Math.max(0, (p.hp / p.maxHp)), 4);
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
